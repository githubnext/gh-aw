name: credentials-check
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: credentials-check
  cancel-in-progress: true
jobs:
  claude:
    name: Claude credential check
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.237
      - name: Generate haiku
        run: claude -p "Write a haiku about credentials."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  codex:
    name: Codex credential check
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: '22'
      - name: Install Codex
        run: npm install -g @openai/codex@0.148.0
      - name: Generate haiku
        run: codex exec --skip-git-repo-check --sandbox read-only "Write a haiku about credentials."
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
