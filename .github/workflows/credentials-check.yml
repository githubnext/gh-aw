name: credentials-check
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: credentials-check
  cancel-in-progress: true
jobs:
  claude:
    name: Claude credential check
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.237
      - name: Generate haiku
        run: claude -p --bare --tools "" --max-budget-usd 1 "Write a haiku about credentials in fewer than 100 tokens."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  codex:
    name: Codex credential check
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: '22'
      - name: Install Codex
        run: npm install -g @openai/codex@0.148.0
      - name: Generate haiku
        run: codex exec --skip-git-repo-check --sandbox read-only --ephemeral --ignore-user-config --ignore-rules "Write a haiku about credentials in fewer than 100 tokens. Do not use tools."
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
  copilot-github-token:
    name: Copilot GitHub Actions token check
    runs-on: ubuntu-latest
    permissions:
      copilot-requests: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: '22'
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Generate haiku
        run: copilot --available-tools "" --disable-builtin-mcps --no-custom-instructions --max-ai-credits 100 --prompt "Write a haiku about credentials in fewer than 100 tokens."
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
  copilot-pat:
    name: Copilot PAT credential check
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: '22'
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Generate haiku
        run: copilot --available-tools "" --disable-builtin-mcps --no-custom-instructions --max-ai-credits 100 --prompt "Write a haiku about credentials in fewer than 100 tokens."
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
