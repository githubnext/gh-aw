        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'trace_graders.cjs'));
            const graderManifestB64 = [
              '',
            ].join('');
            const graderExecB64 = [
              '',
              '',
              '',
            ].join('');
            await main(graderManifestB64, graderExecB64);
        env:
          GH_TOKEN: ${{ github.token }}
          GH_AW_RUN_CREATED_AT: ${{ needs.activation.outputs.run_created_at }}
      - name: Redact grader outputs
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { redactFilesInDir } = require(path.join(actionsDir, 'redact_secrets.cjs'));
            await redactFilesInDir('/tmp/gh-aw/agent/graders');
        env:
          GH_AW_SECRET_NAMES: 'CODEX_API_KEY,GH_AW_GITHUB_MCP_SERVER_TOKEN,GH_AW_GITHUB_TOKEN,GITHUB_TOKEN,OPENAI_API_KEY'
