        run: |
          node << 'GH_AW_MCP_SCRIPTS_WRITER_EOF'
          const fs = require('fs');
          const path = require('path');
          const dir = process.env.GH_AW_MCP_SCRIPTS_DIR;
          const count = parseInt(process.env.GH_AW_SCRIPT_COUNT || '0', 10);
          for (let i = 0; i < count; i++) {
            const name = process.env['GH_AW_SCRIPT_' + i + '_NAME'];
            const ext = process.env['GH_AW_SCRIPT_' + i + '_EXT'];
            const exec = process.env['GH_AW_SCRIPT_' + i + '_EXEC'] === 'true';
            const b64 = process.env['GH_AW_SCRIPT_' + i + '_B64'];
            if (!name || !ext || !b64) continue;
            if (!/^[a-zA-Z][a-zA-Z0-9_-]{0,63}$/.test(name)) throw new Error('Invalid tool name: ' + name);
            const content = Buffer.from(b64, 'base64').toString('utf8');
            const filePath = path.join(dir, name + '.' + ext);
            fs.writeFileSync(filePath, content, 'utf8');
            if (exec) { fs.chmodSync(filePath, 0o755); }
