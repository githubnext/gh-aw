    - env:
        GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
        GH_AW_ALLOWED_DOMAINS: "*.docker.com,*.docker.io,api.business.githubcopilot.com,api.enterprise.githubcopilot.com,api.github.com,api.githubcopilot.com,api.individual.githubcopilot.com,api.npms.io,api.snapcraft.io,archive.ubuntu.com,auth.docker.io,azure.archive.ubuntu.com,bun.sh,cdn.jsdelivr.net,cdn.sheetjs.com,code.jquery.com,crl.geotrust.com,crl.globalsign.com,crl.identrust.com,crl.sectigo.com,crl.thawte.com,crl.usertrust.com,crl.verisign.com,crl3.digicert.com,crl4.digicert.com,crls.ssl.com,data.jsdelivr.com,deb.nodesource.com,deno.land,dl.k8s.io,esm.sh,fonts.googleapis.com,fonts.gstatic.com,gcr.io,get.pnpm.io,ghcr.io,github.com,googleapis.deno.dev,googlechromelabs.github.io,host.docker.internal,json-schema.org,json.schemastore.org,jsr.io,keyserver.ubuntu.com,learn.microsoft.com,mcp.datadoghq.com,mcp.deepwiki.com,mcp.tavily.com,mcr.microsoft.com,nodejs.org,npm.pkg.github.com,npmjs.com,npmjs.org,ocsp.digicert.com,ocsp.geotrust.com,ocsp.globalsign.com,ocsp.identrust.com,ocsp.sectigo.com,ocsp.ssl.com,ocsp.thawte.com,ocsp.usertrust.com,ocsp.verisign.com,packagecloud.io,packages.cloud.google.com,packages.microsoft.com,pkgs.k8s.io,ppa.launchpad.net,production.cloudflare.docker.com,quay.io,raw.githubusercontent.com,registry.bower.io,registry.hub.docker.com,registry.npmjs.com,registry.npmjs.org,registry.yarnpkg.com,repo.yarnpkg.com,s.symcb.com,s.symcd.com,security.ubuntu.com,skimdb.npmjs.com,storage.googleapis.com,telemetry.enterprise.githubcopilot.com,telemetry.vercel.com,ts-crl.ws.symantec.com,ts-ocsp.ws.symantec.com,www.googleapis.com,www.npmjs.com,www.npmjs.org,yarnpkg.com"
        GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG: "{\"create_discussion\":{\"category\":\"audits\",\"close_older_discussions\":true,\"expires\":24,\"fallback_to_issue\":true,\"max\":1,\"title_prefix\":\"[mcp-inspector] \"},\"create_report_incomplete_issue\":{},\"missing_data\":{},\"missing_tool\":{},\"noop\":{\"max\":1,\"report-as-issue\":\"true\"},\"report_incomplete\":{}}"
        GH_AW_SAFE_OUTPUT_JOBS: "{\"notion_add_comment\":\"\",\"post_to_slack_channel\":\"\"}"
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
      id: process_safe_outputs
      name: Process Safe Outputs
      uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553
      with:
        github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        script: |
          const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
          setupGlobals(core, github, context, exec, io, getOctokit);
          const { main } = require('${{ runner.temp }}/gh-aw/actions/safe_output_handler_manager.cjs');
          await main();
    - if: always()
      name: Upload Safe Outputs Items
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        if-no-files-found: ignore
        name: safe-outputs-items
        path: |
          /tmp/gh-aw/safe-output-items.jsonl
          /tmp/gh-aw/temporary-id-map.json
    timeout-minutes: 15
  update_cache_memory:
    env:
      GH_AW_WORKFLOW_ID_SANITIZED: mcpinspector
    if: |
      always() && (needs.detection.result == 'success' || needs.detection.result == 'skipped') && needs.agent.result == 'success'
    needs:
    - activation
    - agent
    - detection
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
    - name: Checkout actions folder
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        repository: github/gh-aw
        sparse-checkout: |
          actions
    - id: setup
      name: Setup Scripts
      uses: ./actions/setup
      with:
        destination: ${{ runner.temp }}/gh-aw/actions
        job-name: ${{ github.job }}
        trace-id: ${{ needs.activation.outputs.setup-trace-id }}
    - continue-on-error: true
      id: download_cache_default
      name: Download cache-memory artifact (default)
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cache-memory
        path: /tmp/gh-aw/cache-memory
    - id: check_cache_default
      name: Check if cache-memory folder has content (default)
      run: |
        if [ -d "/tmp/gh-aw/cache-memory" ] && [ "$(ls -A /tmp/gh-aw/cache-memory 2>/dev/null)" ]; then
          echo "has_content=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_content=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
    - if: steps.check_cache_default.outputs.has_content == 'true'
      name: Save cache-memory to cache (default)
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        key: memory-none-nopolicy-${{ env.GH_AW_WORKFLOW_ID_SANITIZED }}-${{ github.run_id }}
        path: /tmp/gh-aw/cache-memory
name: MCP Inspector Agent
"on":
  schedule:
  - cron: 35 18 * * 1
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: Agent caller context (used internally by Agentic Workflows).
        required: false
        type: string
permissions: {}
run-name: MCP Inspector Agent
