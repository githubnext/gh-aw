name: List Active Agentic Task Sessions

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  list-active-agent-task-sessions:
    runs-on: ubuntu-latest
    steps:
      - name: Install gh agent-task extension
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
        run: gh extension install github/agent-task || gh extension upgrade github/agent-task

      - name: Print active agentic task sessions
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          active_sessions="$(gh agent-task list --limit 100 --json id,name,state,repository,updatedAt,pullRequestNumber,pullRequestUrl --jq '.[] | select(.state != "completed" and .state != "failed" and .state != "canceled")')"
          if [ -z "$active_sessions" ]; then
            echo "No active agentic task sessions found."
            exit 0
          fi

          echo "Active agentic task sessions:"
          echo "$active_sessions"
