name: Build and publish serena-mcp-server container

# Rebuilds ghcr.io/github/serena-mcp-server when the Dockerfile changes,
# on a weekly schedule to pick up updated base-image patches, and on demand.
# The weekly schedule ensures that vulnerability scanners always have a
# reasonably fresh image to scan.

on:
  push:
    branches: ["main"]
    paths:
      - "containers/serena-mcp-server/**"
  schedule:
    - cron: "0 4 * * 1"  # Weekly on Monday at 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-serena-mcp-server
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/github/serena-mcp-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./containers/serena-mcp-server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image digest
        run: echo "Published ghcr.io/github/serena-mcp-server:latest"
