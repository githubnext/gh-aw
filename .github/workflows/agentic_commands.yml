name: "Agentic Slash Command Trigger"

on:
  issues:
    types: [edited, opened, reopened]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [edited, opened, reopened]
  pull_request_review_comment:
    types: [created, edited]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]

permissions: {}

