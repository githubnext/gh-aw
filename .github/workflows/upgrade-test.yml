name: Extension Upgrade Test

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *'
  release:
    types: [created]
  pull_request:
    paths:
      - 'pkg/cli/update_extension_check.go'
      - '.github/workflows/upgrade-test.yml'
      - 'install-gh-aw.sh'

permissions: {}

jobs:
  collect-releases:
    name: Collect release scenarios
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      latest: ${{ steps.releases.outputs.latest }}
      scenarios: ${{ steps.releases.outputs.scenarios }}
    steps:
      - name: Collect latest and latest-1..latest-5 releases
        id: releases
        shell: bash
        run: |
          set -euo pipefail

          RELEASES=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.draft == false) | .tag_name]')
          RELEASE_COUNT=$(jq 'length' <<<"$RELEASES")

          if [ "$RELEASE_COUNT" -lt 6 ]; then
            echo "❌ Need at least 6 non-draft releases, found $RELEASE_COUNT"
            exit 1
          fi

          LATEST=$(jq -r '.[0]' <<<"$RELEASES")
          SCENARIOS=$(jq -c '
            [range(1; 6) as $i | {name: ("latest-" + ($i|tostring)), previous: .[$i]}]
          ' <<<"$RELEASES")

          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "scenarios=$SCENARIOS" >> "$GITHUB_OUTPUT"
          echo "Latest release: $LATEST"
          echo "Scenarios: $SCENARIOS"

  upgrade-path-test:
    name: Extension upgrade on ${{ matrix.scenario.name }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    needs:
      - collect-releases
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.collect-releases.outputs.scenarios) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION_REGEX: 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?'
      PREVIOUS: ${{ matrix.scenario.previous }}
      LATEST: ${{ needs.collect-releases.outputs.latest }}
    steps:
      - name: Install previous version (${{ matrix.scenario.name }})
        shell: bash
        run: |
          set -euo pipefail
          echo "Installing gh-aw $PREVIOUS ..."
          gh extension install github/gh-aw --pin "$PREVIOUS" --force

          INSTALLED=$(gh aw version 2>&1 | grep -oE "$VERSION_REGEX" | head -1)
          echo "Installed: $INSTALLED"
          [ "$INSTALLED" = "$PREVIOUS" ] || { echo "❌ Expected $PREVIOUS, got $INSTALLED"; exit 1; }
          echo "✅ ${{ matrix.scenario.name }} installed: $INSTALLED"

      - name: Run gh aw upgrade
        shell: bash
        run: |
          set -euo pipefail
          gh aw upgrade --pre-releases --no-fix

      - name: Verify version after upgrade
        shell: bash
        run: |
          set -euo pipefail
          INSTALLED=$(gh aw version 2>&1 | grep -oE "$VERSION_REGEX" | head -1)
          echo "Installed: $INSTALLED"
          echo "Expected:  $LATEST"
          [ "$INSTALLED" = "$LATEST" ] || { echo "❌ Version mismatch: got $INSTALLED, expected $LATEST"; exit 1; }
          echo "✅ Upgrade succeeded: $INSTALLED"

  conclusion:
    name: Conclusion
    if: always()
    needs:
      - upgrade-path-test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPGRADE_JOB_NAME_PREFIX: "Extension upgrade on latest-"
    steps:
      - name: Collect upgrade test outcomes
        id: outcomes
        shell: bash
        run: |
          set -euo pipefail

          FAILURES=$(
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
              | jq -r --arg job_prefix "$UPGRADE_JOB_NAME_PREFIX" '
                .jobs
                | map(select(.name | startswith($job_prefix)))
                | map(select(.conclusion != "success"))
                | map("\(.name): \(.conclusion // "unknown")")
                | join("\n")'
          )

          if [ -n "$FAILURES" ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
            {
              echo "failures<<EOF"
              echo "$FAILURES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## ❌ Extension upgrade failures"
              echo
              echo '```text'
              echo "$FAILURES"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
            echo "## ✅ Extension upgrade tests passed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create issue for upgrade failures
        if: ${{ steps.outcomes.outputs.has_failures == 'true' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || 'n/a' }}
          FAILURES: ${{ steps.outcomes.outputs.failures }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="Extension Upgrade Test failure (${EVENT_NAME})"
          BODY=$(cat <<EOF
          The extension upgrade workflow failed.

          Event: \`${EVENT_NAME}\`
          Release tag: \`${RELEASE_TAG}\`

          Run: ${RUN_URL}

          Failed jobs:
          \`\`\`text
          ${FAILURES}
          \`\`\`
          EOF
          )

          gh issue create --title "$TITLE" --body "$BODY" --label "bug"
