version: 2
multi-ecosystem-groups:
  workflow-manifests:
    schedule:
      interval: weekly
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: npm
  directory: /docs
  schedule:
    interval: weekly
- package-ecosystem: npm
  directory: /actions/setup/js
  schedule:
    interval: weekly
- package-ecosystem: npm
  directory: /.github/workflows
  multi-ecosystem-group: workflow-manifests
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
- package-ecosystem: pip
  directory: /.github/workflows
  multi-ecosystem-group: workflow-manifests
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
- package-ecosystem: gomod
  directory: /.github/workflows
  multi-ecosystem-group: workflow-manifests
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
