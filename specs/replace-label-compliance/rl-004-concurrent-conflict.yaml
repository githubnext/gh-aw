# RL-004 Concurrent-Conflict Handling — Compliance Fixture
# Tests: T-RL-041, T-RL-042, T-RL-043, T-RL-044
# Spec: §5.9 Concurrent-Conflict Handling (RL-041 – RL-044)

fixture_id: "rl-004-concurrent-conflict"
description: >
  When a label is modified on the target item between the Stage 5 read and the Stage 8 PUT,
  the implementation MUST handle the resulting label conflict deterministically.
  A successful PUT with an unexpected final label set MUST be logged as a warning but
  still treated as success (RL-041). No silent re-try after a successful response is
  permitted (RL-042). A hard HTTP error (409/422) due to a missing label MUST fail closed
  with no auto-retry (RL-043). Both before- and after-state labels MUST be logged (RL-044).

spec_refs:
  - "RL-041 — Unexpected label set after successful PUT MUST trigger a structured warning log"
  - "RL-042 — No silent retry after a successful PUT response to reconcile a conflict"
  - "RL-043 — HTTP 409/422 on missing label MUST fail closed; no auto-retry"
  - "RL-044 — Before-state (Stage 5) and after-state (Stage 8) labels SHOULD be logged"
  - "T-RL-041 — Successful PUT with unexpected label set: success=true + warning logged"
  - "T-RL-042 — No re-PUT issued when Stage 8 response differs from expected"
  - "T-RL-043 — HTTP 409 on label removal of absent label fails closed"
  - "T-RL-044 — Both label snapshots appear in execution state"

scenarios:
  # --- Scenario A: Successful PUT but returned labels differ from expected ---
  # A concurrent automation added an extra label between Stage 5 read and Stage 8 write.
  # The PUT succeeded (HTTP 200), but the returned label set contains an unexpected extra
  # label. The implementation MUST log a structured warning and return success: true.
  - scenario_id: "rl-004-concurrent-unexpected-labels-success"
    description: >
      Stage 8 PUT returns HTTP 200 but the returned label set differs from what was
      computed in Stage 7 (an extra label was added concurrently). Operation MUST succeed
      with a structured warning logged.
    input:
      safe_output_config:
        allowed-add:
          - "in-review"
        allowed-remove:
          - "pending"
        blocked: []
      message:
        label_to_add: "in-review"
        label_to_remove: "pending"
      item_state_at_stage5:
        labels:
          - "pending"
          - "triage"
      api_response:
        status: 200
        returned_labels:
          - "in-review"
          - "triage"
          - "ci-triggered"        # injected by concurrent automation
    expected:
      decision: allow
      success: true
      warning_logged: true
      warning_contains: "unexpected label set"
      retry_attempted: false

  # --- Scenario B: Successful PUT, implementation MUST NOT issue a re-PUT ---
  # After a successful Stage 8 PUT, if the caller detects that `label_to_remove` is still
  # present in the response (e.g., due to a server-side caching anomaly), the
  # implementation MUST NOT silently re-issue the PUT. Re-applying is the caller's
  # responsibility.
  - scenario_id: "rl-004-no-retry-after-success"
    description: >
      Stage 8 PUT returns HTTP 200. Even if the returned label set still contains
      label_to_remove (e.g., server-side anomaly), the implementation MUST NOT
      automatically retry the PUT. It MUST log a warning and return success: true.
    input:
      safe_output_config:
        allowed-add:
          - "approved"
        allowed-remove:
          - "needs-revision"
        blocked: []
      message:
        label_to_add: "approved"
        label_to_remove: "needs-revision"
      item_state_at_stage5:
        labels:
          - "needs-revision"
      api_response:
        status: 200
        returned_labels:
          - "needs-revision"   # still present despite PUT — server anomaly
          - "approved"
    expected:
      decision: allow
      success: true
      warning_logged: true
      retry_attempted: false
      api_call_count: 1         # exactly one PUT; no re-PUT

  # --- Scenario C: Stage 8 PUT returns HTTP 409 — fail closed, no retry ---
  # The target label was deleted between Stage 5 and Stage 8 by a concurrent actor.
  # The PUT returns HTTP 422 (GitHub uses 422 for label-not-found in some contexts).
  # The implementation MUST fail closed: hard error, success: false, no retry.
  - scenario_id: "rl-004-http-409-fail-closed"
    description: >
      Stage 8 PUT returns HTTP 422 because label_to_add was deleted between Stage 5 read
      and Stage 8 write. The implementation MUST fail closed: return success=false with
      a descriptive error, and MUST NOT auto-retry.
    input:
      safe_output_config:
        allowed-add:
          - "ready-to-merge"
        allowed-remove:
          - "needs-revision"
        blocked: []
      message:
        label_to_add: "ready-to-merge"
        label_to_remove: "needs-revision"
      item_state_at_stage5:
        labels:
          - "needs-revision"
      api_response:
        status: 422
        error_message: "Label does not exist"
    expected:
      decision: allow          # label passes Stage 4 validation (existed at Stage 5)
      success: false           # hard error from Stage 8 failure
      error_code: 422
      retry_attempted: false
      skipped: false           # NOT a skip — this is a hard error per RL-043
