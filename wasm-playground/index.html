<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gh-aw Playground — Agentic Workflow Compiler</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #484f58;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --green: #3fb950;
      --red: #f85149;
      --orange: #d29922;
      --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --radius: 6px;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .logo span { color: var(--accent); }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--orange);
      transition: background 0.3s;
    }

    #status-dot.ready { background: var(--green); }
    #status-dot.error { background: var(--red); }

    #compile-btn {
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font-sans);
      border: 1px solid rgba(88, 166, 255, 0.4);
      border-radius: var(--radius);
      background: rgba(88, 166, 255, 0.1);
      color: var(--accent);
      cursor: pointer;
      transition: all 0.15s;
    }

    #compile-btn:hover:not(:disabled) {
      background: rgba(88, 166, 255, 0.2);
      border-color: var(--accent);
    }

    #compile-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #compile-btn.compiling {
      color: var(--text-secondary);
    }

    /* ── Main Layout ────────────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .panel + .panel { border-left: 1px solid var(--border); }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    .panel-actions {
      display: flex;
      gap: 8px;
    }

    .panel-btn {
      font-size: 12px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all 0.15s;
    }

    .panel-btn:hover {
      color: var(--text-primary);
      border-color: var(--text-muted);
    }

    .panel-body {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    textarea, .output-area {
      width: 100%;
      height: 100%;
      padding: 16px;
      border: none;
      outline: none;
      resize: none;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      tab-size: 2;
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    .output-area {
      overflow: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .output-area.placeholder {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      font-size: 14px;
    }

    /* ── Resize Handle ──────────────────────────────────────── */
    .resize-handle {
      width: 4px;
      cursor: col-resize;
      background: var(--border);
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .resize-handle:hover, .resize-handle.active {
      background: var(--accent);
    }

    /* ── Validation Panel ───────────────────────────────────── */
    .validation-bar {
      display: none;
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
      max-height: 180px;
      overflow: auto;
    }

    .validation-bar.visible { display: block; }

    .validation-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg-secondary);
      z-index: 1;
    }

    .validation-header .label { color: var(--text-secondary); }

    .validation-header .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0 4px;
    }

    .validation-header .close-btn:hover { color: var(--text-primary); }

    .validation-body { padding: 8px 16px; }

    .validation-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 4px 0;
      font-size: 12px;
      font-family: var(--font-mono);
      line-height: 1.5;
    }

    .validation-item .icon { flex-shrink: 0; }
    .validation-item.error .icon { color: var(--red); }
    .validation-item.warning .icon { color: var(--orange); }
    .validation-item.success .icon { color: var(--green); }
    .validation-item .path { color: var(--text-muted); }
    .validation-item .msg { color: var(--text-primary); }

    /* ── Status Bar ─────────────────────────────────────────── */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 16px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    footer a:hover { color: var(--accent); }

    /* ── Loading Overlay ────────────────────────────────────── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13, 17, 23, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 16px;
      transition: opacity 0.3s;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-text {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* ── Error Toast ────────────────────────────────────────── */
    #error-toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-tertiary);
      border: 1px solid var(--red);
      color: var(--text-primary);
      padding: 10px 20px;
      border-radius: var(--radius);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 200;
      max-width: 600px;
    }

    #error-toast.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 768px) {
      main { flex-direction: column; }
      .panel + .panel { border-left: none; border-top: 1px solid var(--border); }
      .resize-handle { display: none; }
    }
  </style>
</head>
<body>
  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Loading WebAssembly compiler...</div>
  </div>

  <!-- Error Toast -->
  <div id="error-toast"></div>

  <!-- Header -->
  <header>
    <div class="header-left">
      <div class="logo"><span>gh-aw</span> playground</div>
      <span class="badge">WebAssembly</span>
    </div>
    <div class="header-right">
      <div id="status-indicator">
        <div id="status-dot"></div>
        <span id="status-text">Loading...</span>
      </div>
      <button id="compile-btn" disabled>Compile</button>
    </div>
  </header>

  <!-- Main Split Panel -->
  <main>
    <!-- Left Panel: Markdown Input -->
    <div class="panel" id="left-panel">
      <div class="panel-header">
        <span class="panel-title">Workflow Markdown</span>
        <div class="panel-actions">
          <button class="panel-btn" id="reset-btn" title="Reset to sample">Reset</button>
        </div>
      </div>
      <div class="panel-body">
        <textarea id="markdown-input" spellcheck="false" placeholder="Paste your agentic workflow markdown here..."></textarea>
      </div>
    </div>

    <!-- Resize Handle -->
    <div class="resize-handle" id="resize-handle"></div>

    <!-- Right Panel: YAML Output + Validation -->
    <div class="panel" id="right-panel">
      <div class="panel-header">
        <span class="panel-title">Compiled YAML</span>
        <div class="panel-actions">
          <button class="panel-btn" id="copy-btn" title="Copy YAML" style="display: none;">Copy</button>
          <button class="panel-btn" id="validate-btn" title="Validate against GitHub Actions schema" style="display: none;">Validate</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="output-area placeholder" id="yaml-output">Click "Compile" to generate YAML</div>
      </div>
      <div class="validation-bar" id="validation-bar">
        <div class="validation-header">
          <span class="label">Schema Validation</span>
          <button class="close-btn" id="close-validation">&times;</button>
        </div>
        <div class="validation-body" id="validation-body"></div>
      </div>
    </div>
  </main>

  <!-- Status Bar -->
  <footer>
    <span id="compile-time"></span>
    <span>gh-aw &middot; Agentic Workflow Compiler</span>
  </footer>

  <!-- CDN deps for YAML schema validation -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ajv@8/dist/ajv7.min.js"></script>

  <script type="module">
    import { createCompiler, CompilerState } from './lib/gh-aw-compiler.js';

    // ── Elements ────────────────────────────────────────────
    const markdownInput  = document.getElementById('markdown-input');
    const yamlOutput     = document.getElementById('yaml-output');
    const compileBtn     = document.getElementById('compile-btn');
    const resetBtn       = document.getElementById('reset-btn');
    const copyBtn        = document.getElementById('copy-btn');
    const validateBtn    = document.getElementById('validate-btn');
    const statusDot      = document.getElementById('status-dot');
    const statusText     = document.getElementById('status-text');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingTextEl  = document.getElementById('loading-text');
    const compileTimeEl  = document.getElementById('compile-time');
    const errorToast     = document.getElementById('error-toast');
    const validationBar  = document.getElementById('validation-bar');
    const validationBody = document.getElementById('validation-body');
    const closeValidation = document.getElementById('close-validation');

    // ── Sample Workflow ─────────────────────────────────────
    const SAMPLE_MARKDOWN = `---
name: hello-world
description: A simple hello world workflow
on:
  workflow_dispatch:
engine: copilot
---

# Mission

Say hello to the world! Check the current date and time, and greet the user warmly.
`;

    markdownInput.value = SAMPLE_MARKDOWN;

    // ── Compiler Init ───────────────────────────────────────
    let compiler = null;
    let currentYaml = '';
    let schemaValidator = null;

    async function initCompiler() {
      try {
        loadingTextEl.textContent = 'Loading WebAssembly compiler...';
        compiler = await createCompiler();
        statusDot.classList.add('ready');
        statusText.textContent = 'Ready';
        compileBtn.disabled = false;
        loadingOverlay.classList.add('hidden');
      } catch (err) {
        statusDot.classList.add('error');
        statusText.textContent = 'Error';
        loadingTextEl.textContent = `Failed to load compiler: ${err.message}`;
        console.error('Compiler init failed:', err);
      }
    }

    // ── Schema Validation Setup ─────────────────────────────
    async function loadSchema() {
      try {
        const res = await fetch('../pkg/workflow/schemas/github-workflow.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const schema = await res.json();
        const ajv = new window.ajv7({ allErrors: true, strict: false });
        schemaValidator = ajv.compile(schema);
      } catch (err) {
        console.warn('Schema load failed (validation disabled):', err.message);
      }
    }

    // ── Compile ─────────────────────────────────────────────
    async function doCompile() {
      if (!compiler || compiler.state !== CompilerState.READY) return;

      const markdown = markdownInput.value;
      if (!markdown.trim()) {
        showToast('Please enter some workflow markdown.');
        return;
      }

      compileBtn.disabled = true;
      compileBtn.textContent = 'Compiling...';
      compileBtn.classList.add('compiling');
      yamlOutput.classList.remove('placeholder');
      yamlOutput.textContent = 'Compiling...';
      copyBtn.style.display = 'none';
      validateBtn.style.display = 'none';
      validationBar.classList.remove('visible');
      compileTimeEl.textContent = '';

      const t0 = performance.now();

      try {
        const result = await compiler.compile(markdown);
        const elapsed = ((performance.now() - t0) / 1000).toFixed(2);

        if (result.error) {
          yamlOutput.textContent = `Error: ${result.error}`;
          currentYaml = '';
          compileTimeEl.textContent = `Compilation failed in ${elapsed}s`;
        } else {
          currentYaml = result.yaml || '';
          yamlOutput.textContent = currentYaml || '(empty output)';
          compileTimeEl.textContent = `Compiled in ${elapsed}s`;
          if (currentYaml) {
            copyBtn.style.display = '';
            validateBtn.style.display = '';
          }

          if (result.warnings && result.warnings.length > 0) {
            showValidation(result.warnings.map(w => ({ type: 'warning', msg: w })));
          }
        }
      } catch (err) {
        yamlOutput.textContent = `Compilation error:\n${err.message}`;
        currentYaml = '';
        compileTimeEl.textContent = 'Compilation failed';
        console.error('Compile error:', err);
      } finally {
        compileBtn.disabled = false;
        compileBtn.textContent = 'Compile';
        compileBtn.classList.remove('compiling');
      }
    }

    // ── Validate YAML ───────────────────────────────────────
    function doValidate() {
      if (!currentYaml) return;

      let parsed;
      try {
        parsed = jsyaml.load(currentYaml);
      } catch (err) {
        showValidation([{ type: 'error', msg: `YAML parse error: ${err.message}` }]);
        return;
      }

      if (!schemaValidator) {
        showValidation([{ type: 'warning', msg: 'Schema not loaded. Validation unavailable.' }]);
        return;
      }

      const valid = schemaValidator(parsed);
      if (valid) {
        showValidation([{ type: 'success', msg: 'Valid GitHub Actions workflow.' }]);
      } else {
        const items = schemaValidator.errors.map(e => ({
          type: 'error',
          path: e.instancePath || '/',
          msg: e.message,
        }));
        showValidation(items);
      }
    }

    // ── Validation Display ──────────────────────────────────
    function showValidation(items) {
      validationBody.innerHTML = '';
      for (const item of items) {
        const icons = { error: '\u2716', warning: '\u26A0', success: '\u2714' };
        const div = document.createElement('div');
        div.className = `validation-item ${item.type}`;
        div.innerHTML =
          `<span class="icon">${icons[item.type] || ''}</span>` +
          (item.path ? `<span class="path">${item.path}</span>` : '') +
          `<span class="msg">${escapeHtml(item.msg)}</span>`;
        validationBody.appendChild(div);
      }
      validationBar.classList.add('visible');
    }

    // ── Copy YAML ───────────────────────────────────────────
    async function doCopy() {
      if (!currentYaml) return;
      try {
        await navigator.clipboard.writeText(currentYaml);
        const orig = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = orig; }, 1500);
      } catch {
        showToast('Copy failed. Try selecting the text manually.');
      }
    }

    // ── Toast ───────────────────────────────────────────────
    function showToast(msg) {
      errorToast.textContent = msg;
      errorToast.classList.add('visible');
      setTimeout(() => { errorToast.classList.remove('visible'); }, 3000);
    }

    // ── Resize Handle ───────────────────────────────────────
    function initResize() {
      const handle = document.getElementById('resize-handle');
      const left   = document.getElementById('left-panel');
      const right  = document.getElementById('right-panel');
      let dragging = false;

      handle.addEventListener('mousedown', (e) => {
        dragging = true;
        handle.classList.add('active');
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        const container = left.parentElement;
        const rect = container.getBoundingClientRect();
        const pct = ((e.clientX - rect.left) / rect.width) * 100;
        const clamped = Math.max(20, Math.min(80, pct));
        left.style.flex = `0 0 ${clamped}%`;
        right.style.flex = `0 0 ${100 - clamped}%`;
      });

      document.addEventListener('mouseup', () => {
        if (dragging) {
          dragging = false;
          handle.classList.remove('active');
        }
      });
    }

    // ── Helpers ─────────────────────────────────────────────
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── Keyboard Shortcut ───────────────────────────────────
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        if (!compileBtn.disabled) doCompile();
      }
    });

    // ── Event Listeners ─────────────────────────────────────
    compileBtn.addEventListener('click', doCompile);
    resetBtn.addEventListener('click', () => { markdownInput.value = SAMPLE_MARKDOWN; });
    copyBtn.addEventListener('click', doCopy);
    validateBtn.addEventListener('click', doValidate);
    closeValidation.addEventListener('click', () => { validationBar.classList.remove('visible'); });

    // ── Init ────────────────────────────────────────────────
    initResize();
    initCompiler();
    loadSchema();
  </script>
</body>
</html>
