# License allowlist from CONTRIBUTING.md.
require-license: true
require-known-license: true

allow:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC

# Base OS packages of upstream container images that gh-aw executes (Alpine
# variants of the MCP server and runtime images, plus the Debian-based
# ghcr.io/github/github-mcp-server image) and the Node/npm runtime those
# images ship. These packages come with the upstream base image, are never linked
# into or redistributed with gh-aw, and are therefore accepted as a documented
# policy exception. The allowlist above still applies to every other package in
# those images.
ignore-packages:
  # Alpine base OS
  - alpine-baselayout
  - alpine-baselayout-data
  - apk-tools
  - bash
  - busybox
  - busybox-binsh
  - ca-certificates
  - ca-certificates-bundle
  - catatonit
  - crun
  - fuse-common
  - fuse-overlayfs
  - fuse3
  - fuse3-libs
  - gdbm
  - glib
  - gmp
  - gnupg-dirmngr
  - gnupg-gpgconf
  - gnupg-keyboxd
  - gnutls
  - gpg
  - gpg-agent
  - gpgme
  - gpgsm
  - git
  - git-init-template
  - libapk
  - libassuan
  - libblkid
  - libbz2
  - libcap2
  - libcurl
  - libgcc
  - libgcrypt
  - libgpg-error
  - libidn2
  - libintl
  - libksba
  - libldap
  - libmd
  - libmnl
  - libmount
  - libncursesw
  - libnftnl
  - libsasl
  - libseccomp
  - libstdc++
  - libtasn1
  - libunistring
  - musl-utils
  - ncurses-terminfo-base
  - nettle
  - nftables
  - npth
  - passt
  - pinentry
  - readline
  - scanelf
  - sqlite-libs
  - ssl_client
  - zlib
  - zstd-libs
  # Debian base OS (ghcr.io/github/github-mcp-server)
  - base-files
  - libc6
  - libssl3
  - media-types
  - netbase
  - tzdata
  # Node.js runtime and npm with its bundled dependencies
  - chownr
  - common-ancestor-path
  - glob
  - isexe
  - lru-cache
  - minimatch
  - minipass
  - minipass-flush
  - node
  - npm
  - path-scurry
  - qrcode-terminal
  - spdx-exceptions
  - spdx-license-ids
  - tar
  - yallist
